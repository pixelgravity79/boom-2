<title>Beanie Hop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --ink: #2a2230;
  --cream: #fffaf0;
  --yellow: #ffd23f;
  --orange: #ff8a3d;
  --red: #ef476f;
  --green: #5cc26b;
  --sky: #5ec8f2;
  --shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
  --font: 'Lilita One', 'Arial Rounded MT Bold', 'Arial Black', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #6fae4c; }
body {
  font-family: var(--font); color: var(--cream);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  overscroll-behavior: none; touch-action: none;
}
#app { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(20, 30, 10, 0.28) 100%); }
#vignette.danger { animation: danger 0.9s ease-in-out infinite; }
@keyframes danger { 50% { box-shadow: inset 0 0 70px 12px rgba(232, 66, 75, 0.55); } }
.hidden { display: none !important; }
button { font-family: var(--font); cursor: pointer; border: 0; touch-action: manipulation; }

.text-stroke, .score, .logo-1, .logo-2, .over-title, h2 {
  -webkit-text-stroke: 0; paint-order: stroke fill;
  text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 6px 0 rgba(0, 0, 0, 0.2);
}

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); display: flex; justify-content: space-between; align-items: flex-start; }
.score { font-size: clamp(44px, 11vw, 72px); line-height: 1; }
.score.pop { animation: pop 0.18s ease-out; }
@keyframes pop { 50% { transform: scale(1.18); } }
.sub { font-size: 15px; opacity: 0.95; margin-top: 4px; text-shadow: 0 2px 0 var(--ink); letter-spacing: 0.5px; }
.hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; pointer-events: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(42, 34, 48, 0.55); padding: 6px 12px; border-radius: 999px; font-size: 18px; color: var(--cream); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.chip b { font-weight: normal; color: var(--yellow); }
.corn-icon { width: 14px; height: 20px; border-radius: 6px 6px 7px 7px; background: repeating-linear-gradient(180deg, #ffd23f 0 4px, #f2a922 4px 5px); box-shadow: inset 3px 0 0 #7ccf5b, inset -3px 0 0 #7ccf5b; }
.trophy { width: 16px; height: 16px; background: var(--yellow); clip-path: polygon(10% 0, 90% 0, 85% 45%, 60% 60%, 60% 80%, 80% 80%, 80% 100%, 20% 100%, 20% 80%, 40% 80%, 40% 60%, 15% 45%); }
.icon-btn { width: 46px; height: 46px; border-radius: 14px; background: var(--cream); box-shadow: var(--shadow); display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 24px; height: 24px; fill: var(--ink); }
.icon-btn.off { opacity: 0.55; }
.icon-btn:active, .big-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25); }

/* Screens */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
.screen.dim { background: rgba(20, 16, 28, 0.45); justify-content: center; }
#title { justify-content: space-between; pointer-events: none; }
#title .ui { pointer-events: auto; }
.logo { text-align: center; margin-top: 4vh; animation: float 3s ease-in-out infinite; }
.logo-1 { font-size: clamp(56px, 17vw, 110px); line-height: 0.9; color: var(--yellow); transform: rotate(-4deg); }
.logo-2 { font-size: clamp(64px, 20vw, 130px); line-height: 0.9; color: var(--cream); transform: rotate(3deg); margin-top: -4px; }
.tagline { margin-top: 10px; font-size: clamp(16px, 4.4vw, 22px); background: var(--ink); color: var(--cream); display: inline-block; padding: 4px 14px; border-radius: 999px; transform: rotate(-2deg); }
@keyframes float { 50% { transform: translateY(-6px); } }
.title-bottom { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.play-hint { font-size: clamp(26px, 7.5vw, 40px); color: var(--cream); animation: pulse 1.1s ease-in-out infinite; text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }
@keyframes pulse { 50% { transform: scale(1.07); } }
.controls { font-size: 14px; background: rgba(42, 34, 48, 0.55); padding: 6px 12px; border-radius: 10px; text-align: center; }
.title-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
.mouse-only { display: none; }
@media (hover: hover) and (pointer: fine) { .mouse-only { display: inline; } .touch-only { display: none; } }

.card { background: var(--cream); color: var(--ink); border-radius: 26px; padding: 22px 22px 18px; width: min(360px, 100%); text-align: center; box-shadow: 0 10px 0 rgba(0, 0, 0, 0.22), 0 20px 40px rgba(0, 0, 0, 0.25); }
.card h2 { margin: 0 0 16px; font-size: 44px; font-weight: normal; color: var(--yellow); }
.card .row { display: flex; gap: 12px; justify-content: center; align-items: center; margin-top: 14px; }
.big-btn { width: 100%; font-size: 28px; padding: 14px 10px 12px; border-radius: 18px; color: #fff; background: var(--green); box-shadow: 0 5px 0 #3d9a4b; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25); }
.text-btn { background: transparent; color: var(--ink); font-size: 18px; padding: 10px 14px; opacity: 0.7; }
.card .icon-btn { background: #efe6d6; }

#over { justify-content: flex-end; padding-bottom: max(28px, env(safe-area-inset-bottom)); pointer-events: none; }
#over .card { pointer-events: auto; animation: rise 0.42s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
@keyframes rise { from { transform: translateY(120%); } }
.over-title { font-size: 46px; color: var(--red); line-height: 1; margin: -48px 0 6px; transform: rotate(-3deg); }
.portrait-wrap { position: relative; width: 104px; height: 104px; margin: 4px auto 6px; }
.portrait-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; border-radius: 50%; background: var(--sky); border: 4px solid var(--ink); }
.over-card.dead-car .portrait-wrap img { transform: scaleY(0.62) translateY(30%); }
.over-card.dead-splash .portrait-wrap img { filter: hue-rotate(150deg) saturate(0.6); }
.ribbon { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%) rotate(-4deg); background: var(--yellow); color: var(--ink); padding: 3px 10px; border-radius: 8px; font-size: 16px; white-space: nowrap; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2); animation: wiggle 0.6s ease-in-out infinite alternate; }
@keyframes wiggle { to { transform: translateX(-50%) rotate(4deg) scale(1.06); } }
.quip { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; opacity: 0.75; min-height: 20px; margin: 8px 0 12px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.stats .label { font-size: 13px; opacity: 0.6; }
.stats .val { font-size: 34px; line-height: 1.05; }

.toast { position: absolute; left: 50%; top: 22%; transform: translate(-50%, 0) scale(0.6); opacity: 0; pointer-events: none; font-size: clamp(30px, 9vw, 48px); color: var(--yellow); text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); transition: transform 0.25s cubic-bezier(0.2, 1.6, 0.4, 1), opacity 0.2s; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
#fps { position: absolute; left: 8px; bottom: 8px; font: 12px/1.2 ui-monospace, monospace; background: rgba(0, 0, 0, 0.6); padding: 4px 6px; border-radius: 6px; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; background: #7fc95c; transition: opacity 0.3s; }
#loading.gone { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .logo, .play-hint, .ribbon { animation: none; } #vignette.danger { animation: none; box-shadow: inset 0 0 60px 10px rgba(232, 66, 75, 0.45); } }
</style>
<div id="app">
  <canvas id="gl" aria-label="Beanie Hop game"></canvas>
  <div id="vignette"></div>

  <div id="hud" class="hidden" aria-live="polite">
    <div class="hud-left">
      <div id="score" class="score">0</div>
      <div id="hud-best" class="sub">TOP 0</div>
    </div>
    <div class="hud-right">
      <div class="chip corn-chip"><span class="corn-icon"></span><span id="corn">0</span></div>
      <button id="pause-btn" class="icon-btn ui" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    </div>
  </div>

  <div id="title" class="screen">
    <div class="logo" aria-label="Beanie Hop">
      <div class="logo-1">BEANIE</div>
      <div class="logo-2">HOP</div>
      <div class="tagline">why did he cross the road?</div>
    </div>
    <div class="title-bottom">
      <div class="play-hint"><span class="touch-only">TAP TO PLAY</span><span class="mouse-only">PRESS SPACE OR CLICK</span></div>
      <div class="controls"><span class="touch-only">Tap to hop toward you &middot; swipe to steer</span><span class="mouse-only">&darr; / S / Space hop &middot; &larr; &rarr; steer &middot; &uarr; back</span></div>
      <div class="title-row">
        <div class="chip"><span class="trophy"></span>BEST <b id="title-best">0</b></div>
        <div class="chip corn-chip"><span class="corn-icon"></span><b id="title-corn">0</b></div>
        <button id="sfx-btn" class="icon-btn ui" aria-label="Sound effects"></button>
        <button id="music-btn" class="icon-btn ui" aria-label="Music"></button>
      </div>
    </div>
  </div>

  <div id="pause" class="screen dim hidden">
    <div class="card">
      <h2>PAUSED</h2>
      <button id="resume-btn" class="big-btn ui">RESUME</button>
      <div class="row">
        <button id="sfx-btn-2" class="icon-btn ui" aria-label="Sound effects"></button>
        <button id="music-btn-2" class="icon-btn ui" aria-label="Music"></button>
        <button id="home-btn-2" class="text-btn ui">MENU</button>
      </div>
    </div>
  </div>

  <div id="over" class="screen hidden">
    <div class="card over-card">
      <div id="over-title" class="over-title">SPLAT!</div>
      <div class="portrait-wrap"><img id="portrait" alt=""><div id="new-best" class="ribbon hidden">NEW BEST!</div></div>
      <div id="quip" class="quip"></div>
      <div class="stats">
        <div><div class="label">SCORE</div><div id="over-score" class="val">0</div></div>
        <div><div class="label">BEST</div><div id="over-best" class="val">0</div></div>
        <div><div class="label">CORN</div><div id="over-corn" class="val">+0</div></div>
      </div>
      <button id="again-btn" class="big-btn ui">PLAY AGAIN</button>
      <button id="home-btn" class="text-btn ui">MENU</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div id="fps" class="hidden"></div>
  <div id="loading">Loading&hellip;</div>
</div>
